<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alivio - Simulador de Gestión de Medicamentos</title>
  <!-- Tailwind CSS para Estilos Modernos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos de Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React y Babel para compilación en navegador -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lexend:wght=300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Lexend', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(20,184,166,0.3);
      border-radius: 99px;
    }
    @keyframes pulse-red {
      0%, 100% { background-color: #ef4444; transform: scale(1); }
      50% { background-color: #b91c1c; transform: scale(1.02); }
    }
    .animate-pulse-red {
      animation: pulse-red 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen selection:bg-teal-500 selection:text-slate-950 overflow-x-hidden p-4 xl:p-6">

  <div id="root"></div>

  <!-- Código de la Aplicación en React -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_MEDICATIONS = [
      { id: '1', nombre: 'Losartán', dosis: '50mg - 1 Tableta', hora: '08:00', frecuencia: '24', tomado: true, icono: '💊', color: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' },
      { id: '2', nombre: 'Metformina', dosis: '850mg - Media Tableta', hora: '14:00', frecuencia: '12', tomado: false, icono: '🥛', color: 'bg-amber-500/10 text-amber-400 border-amber-500/30' },
      { id: '3', nombre: 'Aspirina Protect', dosis: '100mg - 1 Cápsula', hora: '21:00', frecuencia: '24', tomado: false, icono: '❤️', color: 'bg-sky-500/10 text-sky-400 border-sky-500/30' }
    ];

    const INITIAL_TELEMETRY = [
      { id: 't1', tipo: 'check', mensaje: 'Manuel marcó "Tomada" la dosis de Losartán 50mg', hora: '08:05 AM', fecha: 'Hoy' },
      { id: 't2', tipo: 'sync', mensaje: 'Dispositivos vinculados mediante token activo', hora: '09:00 AM', fecha: 'Hoy' },
      { id: 't3', tipo: 'info', mensaje: 'Teléfono de Manuel con batería suficiente (88%)', hora: '10:15 AM', fecha: 'Hoy' }
    ];

    function App() {
      // API Key configurada por defecto según lo solicitado
      const [apiKey, setApiKey] = useState('AIzaSyBHy_Mi0-0-iMwaYE9I3oa2PlHY8xxK_1c');
      const [showApiKeyInfo, setShowApiKeyInfo] = useState(false);
      const [systemLogs, setSystemLogs] = useState([
        'Consola de Sincronización en la Nube de Alivio activada.',
        'API Key de Gemini integrada y lista para análisis de recetas.',
        'Esperando registros e interacciones de demostración...'
      ]);

      // --- ESTADO DE SILENCIO DE ASISTENTE POR VOZ ---
      const [isVoiceMuted, setIsVoiceMuted] = useState(false);
      const isVoiceMutedRef = useRef(false);

      useEffect(() => {
        isVoiceMutedRef.current = isVoiceMuted;
      }, [isVoiceMuted]);

      // --- BASE DE DATOS LOCAL SIMULADA (PACIENTES Y FAMILIARES VINCULADOS) ---
      const [patients, setPatients] = useState([
        { id: '1', nombre: 'Manuel', pin: '1234', edad: 78, condicion: 'Hipertensión y Diabetes', token: '583912' }
      ]);
      const [caregivers, setCaregivers] = useState([
        { email: 'sofia.cuidador@alivio.com', password: '1234', nombre: 'Sofía', pacienteId: '1' }
      ]);

      // --- ESTADOS COMPARTIDOS EN TIEMPO REAL (SINCRONIZACIÓN EN LA NUBE) ---
      const [medications, setMedications] = useState(INITIAL_MEDICATIONS);
      const [telemetry, setTelemetry] = useState(INITIAL_TELEMETRY);
      const [activeAlarm, setActiveAlarm] = useState(null); 
      const [systemTime, setSystemTime] = useState(''); // Se inicializa dinámicamente con el reloj activo
      const [incomingCallFrom, setIncomingCallFrom] = useState(null); 

      // --- ESTADOS INTERNOS DEL TELÉFONO DEL PACIENTE (TELÉFONO 1) ---
      const [patientScreen, setPatientScreen] = useState('welcome'); // 'welcome', 'pin-auth', 'dashboard', 'ai-chat', 'add-med', 'register'
      const [patientPin, setPatientPin] = useState('');
      const [activePatientIdx, setActivePatientIdx] = useState(0);
      const [patientRegForm, setPatientRegForm] = useState({ nombre: '', pin: '', edad: '', condicion: '' });

      const [isRecordingVoice, setIsRecordingVoice] = useState(false);
      const [medForm, setMedForm] = useState({ nombre: '', dosis: '', hora: '08:00', frecuencia: '8' });
      const [ocrLoading, setOcrLoading] = useState(false);
      
      const [chatMessages, setChatMessages] = useState([
        { sender: 'assistant', text: '¡Hola! Soy tu asistente Alivio AI. ¿Tienes alguna duda sobre tus pastillas de hoy? Estoy aquí para cuidarte.', time: '14:15' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [aiLoading, setAiLoading] = useState(false);

      // --- ESTADOS INTERNOS DEL TELÉFONO DEL CUIDADOR (TELÉFONO 2) ---
      const [caregiverScreen, setCaregiverScreen] = useState('welcome'); // 'welcome', 'login', 'dashboard', 'register'
      const [activeCaregiverIdx, setActiveCaregiverIdx] = useState(0);
      const [caregiverRegForm, setCaregiverRegForm] = useState({ nombre: '', email: '', password: '', tokenEnlace: '' });
      const [caregiverEmail, setCaregiverEmail] = useState('sofia.cuidador@alivio.com');
      const [caregiverPassword, setCaregiverPassword] = useState('1234');
      const [caregiverErrorMsg, setCaregiverErrorMsg] = useState('');

      // Referencias para scrolls
      const logContainerRef = useRef(null);
      const chatEndRef = useRef(null);

      // --- RELOJ EN TIEMPO REAL ACTIVO ---
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          let hours = now.getHours();
          const minutes = String(now.getMinutes()).padStart(2, '0');
          const seconds = String(now.getSeconds()).padStart(2, '0');
          const ampm = hours >= 12 ? 'PM' : 'AM';
          hours = hours % 12;
          hours = hours ? hours : 12; // La hora '0' debe ser '12'
          const hoursStr = String(hours).padStart(2, '0');
          
          setSystemTime(`${hoursStr}:${minutes}:${seconds} ${ampm}`);
        };

        updateClock(); // Carga inicial inmediata
        const intervalId = setInterval(updateClock, 1000); // Actualización cada segundo
        return () => clearInterval(intervalId);
      }, []);

      useEffect(() => {
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }, [patientScreen, caregiverScreen, activeAlarm, chatMessages, medications, telemetry, ocrLoading, isRecordingVoice, incomingCallFrom, caregiverErrorMsg, isVoiceMuted]);

      useEffect(() => {
        if (logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [systemLogs]);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages]);

      const addLog = (msg) => {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        setSystemLogs(prev => [...prev, `[${time}] ${msg}`]);
      };

      // --- ACCIÓN: SILENCIAR/ACTIVAR VOZ CON ALERTA AL FAMILIAR ---
      const handleToggleVoice = () => {
        const newMutedState = !isVoiceMuted;
        setIsVoiceMuted(newMutedState);
        const patientName = patients[activePatientIdx]?.nombre || 'Paciente';
        const caregiverName = caregivers[activeCaregiverIdx]?.nombre || 'Familiar';

        if (newMutedState) {
          addLog(`🔇 ${patientName} SILENCIÓ la guía por voz. Notificando a su familiar ${caregiverName}...`);
          setTelemetry(prev => [
            {
              id: Date.now().toString(),
              tipo: 'alert',
              mensaje: `⚠️ ${patientName} desactivó (silenció) la guía por voz asistida`,
              hora: systemTime,
              fecha: 'Hoy'
            },
            ...prev
          ]);
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
        } else {
          addLog(`🔊 ${patientName} REACTIVÓ la guía por voz.`);
          setTelemetry(prev => [
            {
              id: Date.now().toString(),
              tipo: 'info',
              mensaje: `🔊 ${patientName} reactivó la guía de voz asistida`,
              hora: systemTime,
              fecha: 'Hoy'
            },
            ...prev
          ]);
          // Confirmación inmediata por voz si reactivó
          setTimeout(() => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance("Guía por voz reactivada.");
              utterance.lang = 'es-MX';
              utterance.rate = 0.85;
              window.speechSynthesis.speak(utterance);
            }
          }, 150);
        }
      };

      const SpeakText = (text) => {
        if (isVoiceMutedRef.current) {
          addLog(`[Voz Omitida] (Silenciado por Manuel): "${text.substring(0, 45)}..."`);
          return;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'es-MX';
          utterance.rate = 0.85; 
          window.speechSynthesis.speak(utterance);
          addLog(`[Voz] Hablando: "${text.substring(0, 45)}..."`);
        } else {
          addLog('[Error] Síntesis de voz no disponible en el navegador.');
        }
      };

      const resolveAlarm = (tomada) => {
        if (!activeAlarm) return;

        const patientName = patients[activePatientIdx]?.nombre || 'Paciente';

        if (tomada) {
          setMedications(prev => prev.map(m => m.id === activeAlarm.id ? { ...m, tomado: true } : m));
          addLog(`✅ Paciente ${patientName} confirmó toma de ${activeAlarm.nombre}`);
          setTelemetry(prev => [
            {
              id: Date.now().toString(),
              tipo: 'check',
              mensaje: `${patientName} confirmó la toma de ${activeAlarm.nombre} (${activeAlarm.dosis})`,
              hora: systemTime,
              fecha: 'Hoy'
            },
            ...prev
          ]);
          SpeakText(`Excelente ${patientName}. He registrado que ya te tomaste tu medicamento. ¡Que tengas un gran día!`);
        } else {
          addLog(`⚠️ Alarma pospuesta por ${patientName}`);
          setTelemetry(prev => [
            {
              id: Date.now().toString(),
              tipo: 'alert',
              mensaje: `${patientName} pospuso la alerta de ${activeAlarm.nombre}`,
              hora: systemTime,
              fecha: 'Hoy'
            },
            ...prev
          ]);
          SpeakText(`Muy bien ${patientName}, te lo recordaré más tarde. No lo olvides por favor.`);
        }
        setActiveAlarm(null);
      };

      // Alarma de medicamento del propio sistema (Notificación nativa propia de la app)
      const triggerSystemAlert = (med) => {
        const patientName = patients[activePatientIdx]?.nombre || 'Paciente';
        addLog(`⏰ Alarma de Sistema: Recordatorio nativo de medicamento para ${med.nombre}`);
        setActiveAlarm({
          ...med,
          isSystem: true
        });
        SpeakText(`Atención ${patientName}, es hora de tomar tu medicamento: ${med.nombre} de las ${med.hora}. Por favor confirma que lo has tomado.`);
      };

      // Alarma forzada por el cuidador (Notificación remota)
      const triggerCaregiverAlert = (med) => {
        const patientName = patients[activePatientIdx]?.nombre || 'Paciente';
        const caregiverName = caregivers[activeCaregiverIdx]?.nombre || 'Familiar';
        addLog(`📢 Cuidador (${caregiverName}) envió recordatorio prioritario para ${med.nombre}`);
        setActiveAlarm({
          ...med,
          isSystem: false
        });
        SpeakText(`Atención ${patientName}, tu familiar ${caregiverName} te solicita que tomes tu medicamento de las ${med.hora}. Por favor confirma que lo has tomado.`);
      };

      const triggerPanicButton = () => {
        const patientName = patients[activePatientIdx]?.nombre || 'Paciente';
        const caregiverName = caregivers[activeCaregiverIdx]?.nombre || 'Familiar';
        
        addLog(`🚨 ALERTA ROJA: ${patientName} activó el botón de AYUDA INMEDIATA`);
        setTelemetry(prev => [
          {
            id: Date.now().toString(),
            tipo: 'alert',
            mensaje: `🔴 ${patientName} presionó el botón de AYUDA INMEDIATA`,
            hora: systemTime,
            fecha: 'Hoy'
          },
          ...prev
        ]);

        setIncomingCallFrom(patientName);
        SpeakText(`Llamando a tu cuidador ${caregiverName} de inmediato por altavoz. Mantén la calma, ${patientName}, tu familia está informada.`);
      };

      const handlePinPress = (num) => {
        if (patientPin.length < 4) {
          const newPin = patientPin + num;
          setPatientPin(newPin);
          SpeakText(num);

          if (newPin.length === 4) {
            const matchingPatientIdx = patients.findIndex(p => p.pin === newPin);

            if (matchingPatientIdx !== -1) {
              setTimeout(() => {
                setActivePatientIdx(matchingPatientIdx);
                SpeakText(`PIN correcto. Bienvenido, ${patients[matchingPatientIdx].nombre}.`);
                setPatientScreen('dashboard');
                addLog(`🔓 Adulto Mayor (${patients[matchingPatientIdx].nombre}) ingresó correctamente.`);
              }, 600);
            } else {
              setTimeout(() => {
                SpeakText("Código incorrecto, por favor inténtalo de nuevo.");
                setPatientPin('');
                addLog("❌ Intento fallido de PIN en el perfil del paciente.");
              }, 600);
            }
          }
        }
      };

      const handleOcrProcess = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setOcrLoading(true);
        addLog(`📷 Receta cargada por el paciente: ${file.name}`);

        const fallback = () => {
          setTimeout(() => {
            setMedForm({
              nombre: 'Paracetamol 500mg',
              dosis: '1 tableta',
              hora: '16:30',
              frecuencia: '6'
            });
            setOcrLoading(false);
            addLog("✨ OCR Completado (Simulado): Extraído 'Paracetamol 500mg' cada 6 horas para las 16:30");
            SpeakText("Receta escaneada correctamente. He completado el formulario.");
          }, 2000);
        };

        if (!apiKey) {
          addLog("ℹ️ Sin API Key. Ejecutando motor de reconocimiento simulado.");
          fallback();
          return;
        }

        try {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = async () => {
            const base64Data = reader.result.split(',')[1];
            addLog("🧠 Analizando receta médica en vivo con la API de Gemini...");
            
            const systemPrompt = "Extrae los datos de salud estructurados en JSON estricto.";
            const userQuery = "Analiza esta receta médica. Extrae el nombre del medicamento, la dosis sugerida, la hora sugerida de toma (HH:MM de 24 horas) y la frecuencia en horas (cada cuántas horas debe tomarse, ej: '8' o '12'). Devuelve un objeto JSON con las claves: 'nombre', 'dosis', 'hora' y 'frecuencia'.";

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
              contents: [{
                parts: [
                  { text: userQuery },
                  { inlineData: { mimeType: file.type, data: base64Data } }
                ]
              }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                  type: "OBJECT",
                  properties: {
                    nombre: { type: "STRING" },
                    dosis: { type: "STRING" },
                    hora: { type: "STRING" },
                    frecuencia: { type: "STRING", description: "Frecuencia en horas, por ejemplo '8'" }
                  },
                  required: ["nombre", "dosis", "hora", "frecuencia"]
                }
              }
            };

            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Fallo en API Gemini");
            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (text) {
              const data = JSON.parse(text);
              setMedForm({
                nombre: data.nombre || 'Desconocido',
                dosis: data.dosis || '1 tableta',
                hora: data.hora || '08:00',
                frecuencia: data.frecuencia || '8'
              });
              addLog(`🟢 Gemini extrajo de forma real: ${JSON.stringify(data)}`);
              SpeakText(`Receta leída con éxito. He completado el formulario.`);
            }
            setOcrLoading(false);
          };
        } catch (err) {
          addLog(`❌ Error de llamada OCR real: ${err.message}`);
          fallback();
        }
      };

      const handleSendChatMessage = async () => {
        if (!chatInput.trim()) return;

        const msgText = chatInput;
        setChatInput('');
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        setChatMessages(prev => [...prev, { sender: 'user', text: msgText, time: timestamp }]);
        setAiLoading(true);

        const fallback = () => {
          setTimeout(() => {
            const response = "Manuel, tu pastilla de Metformina ayuda a controlar el azúcar en tu cuerpo para mantenerte con mucha energía. Es muy importante que la tomes junto con tu comida para que tu estómago se sientan muy bien. ¡Estoy aquí para cuidarte!";
            setChatMessages(prev => [...prev, { sender: 'assistant', text: response, time: timestamp }]);
            setAiLoading(false);
            addLog("🤖 Alivio AI respondió de manera empática.");
          }, 1500);
        };

        if (!apiKey) {
          addLog("ℹ️ Sin API Key. Cargando respuesta médica predefinida.");
          fallback();
          return;
        }

        try {
          addLog("💬 Consultando a Gemini 2.5 Flash...");
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          const systemPrompt = "Eres 'Alivio AI', un asistente de salud extremadamente cariñoso, respetuoso y paciente dedicado al acompañamiento de adultos mayores. Responde con palabras sencillas, explicaciones claras y con mucho amor, en un párrafo de máximo 3 líneas.";
          const payload = {
            contents: [{
              parts: [{ text: `El paciente Manuel pregunta: "${msgText}". Por favor, respóndele directamente.` }]
            }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
          };

          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) throw new Error("Fallo en la red");
          const data = await response.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Disculpa Manuel, tuve un pequeño problema al pensar, ¿podrías repetírmelo?";
          
          setChatMessages(prev => [...prev, { sender: 'assistant', text: reply, time: timestamp }]);
        } catch (err) {
          addLog(`❌ Error en Chat AI real: ${err.message}`);
          fallback();
        } finally {
          setAiLoading(false);
        }
      };

      const simulateVoiceInput = () => {
        setIsRecordingVoice(true);
        addLog("🎤 Dictado por voz activado en el dispositivo del paciente.");
        SpeakText("Dime qué medicina quieres programar.");
        setTimeout(() => {
          setMedForm({
            nombre: 'Atorvastatina 20mg',
            dosis: '1 tableta en la noche',
            hora: '21:00',
            frecuencia: '24'
          });
          setIsRecordingVoice(false);
          addLog("✨ Dictado procesado exitosamente.");
          SpeakText("He configurado Atorvastatina cada 24 horas para las 21:00.");
        }, 3000);
      };

      const handleSaveMedicine = () => {
        if (!medForm.nombre) return;
        const newMed = {
          id: Date.now().toString(),
          nombre: medForm.nombre,
          dosis: medForm.dosis || '1 dosis',
          hora: medForm.hora || '12:00',
          frecuencia: medForm.frecuencia || '24',
          tomado: false,
          icono: '💊',
          color: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30'
        };
        setMedications(prev => [...prev, newMed].sort((a, b) => a.hora.localeCompare(b.hora)));
        addLog(`💾 Nuevo medicamento guardado localmente: ${newMed.nombre} cada ${newMed.frecuencia}h`);
        setPatientScreen('dashboard');
        SpeakText("Medicamento guardado en tu agenda.");
      };

      return (
        <div className="max-w-7xl mx-auto flex flex-col gap-6">
          
          {/* CABECERA PRINCIPAL */}
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/50 p-6 rounded-3xl border border-slate-700/50 backdrop-blur-md">
            <div>
              <div className="flex items-center gap-3">
                <span className="p-2.5 bg-gradient-to-tr from-teal-500 to-emerald-400 text-slate-950 font-black text-2xl rounded-2xl">AL</span>
                <div>
                  <h1 className="text-2xl font-black bg-gradient-to-r from-teal-400 to-emerald-300 bg-clip-text text-transparent">Alivio Senior - Sincronización Remota</h1>
                  <p className="text-xs text-slate-400 font-medium font-mono">Modo de Demostración: Enlace de Dispositivos por Token e Inicio de Sesión Compartido</p>
                </div>
              </div>
            </div>
            
            {/* API KEY CONFIGURATOR */}
            <div className="flex flex-col gap-1 w-full md:w-auto md:min-w-[280px]">
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-300 font-bold uppercase tracking-wider">🔑 Gemini API Key (Integrada)</span>
                <button onClick={() => setShowApiKeyInfo(!showApiKeyInfo)} className="text-teal-400 hover:underline">Info</button>
              </div>
              <input 
                type="text" 
                placeholder="Ingresa Gemini API Key..."
                value={apiKey}
                onChange={(e) => setApiKey(e.target.value)}
                className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-teal-500 font-mono"
              />
              {showApiKeyInfo && (
                <p className="text-[10px] text-slate-400 max-w-xs mt-1 leading-relaxed">
                  Permite realizar consultas reales de OCR de recetas y chat inteligente interactivo directo con Gemini en vivo durante tu video. Hemos integrado tu clave de desarrollo por defecto.
                </p>
              )}
            </div>
          </div>

          {/* CUERPO DEL SIMULADOR: 3 COLUMNAS */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            {/* COLUMNA 1: PANEL DE CONTROL Y CENTRAL DE LOGS */}
            <div className="lg:col-span-3 bg-slate-800/80 border border-slate-700/60 rounded-3xl p-5 flex flex-col gap-5 backdrop-blur-md">
              <div>
                <h2 className="text-sm font-bold text-teal-400 uppercase tracking-widest flex items-center gap-2">
                  <span className="w-2.5 h-2.5 bg-teal-500 rounded-full animate-pulse"></span>
                  Servidor Central
                </h2>

                    )}

                  </div>

                  {/* PANTALLA GIGANTE ACTIVA SOBREPUESTA DE LLAMADA DE EMERGENCIA ENTRANTE */}
                  {incomingCallFrom && (
                    <div className="absolute inset-0 z-50 bg-rose-950/95 animate-pulse-red flex flex-col justify-between p-5 text-white text-center">
                      <div className="flex flex-col items-center gap-3 pt-6">
                        <span className="text-4xl animate-bounce">🚨</span>
                        <h4 className="text-lg font-black tracking-tight uppercase text-rose-200">¡LLAMADA DE EMERGENCIA!</h4>
                        <span className="text-[9px] text-white/70 tracking-widest uppercase">Entrante en Tiempo Real</span>
                      </div>

                      <div className="bg-slate-900/90 p-5 rounded-2xl border border-rose-500/30 my-auto shadow-2xl flex flex-col items-center gap-3 relative overflow-hidden">
                        <div className="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center animate-ping absolute opacity-20"></div>
                        <div className="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center text-3xl font-bold relative">
                          {incomingCallFrom[0]?.toUpperCase()}
                        </div>
                        <div>
                          <h5 className="text-lg font-black leading-tight text-white">{incomingCallFrom}</h5>
                          <p className="text-xs text-rose-300 font-bold mt-1">Presionó el Botón de Pánico</p>
                        </div>
                        <span className="text-[10px] text-white/50 block mt-1 animate-pulse">Intentando establecer audio...</span>
                      </div>

                      <div className="flex flex-col gap-2.5 pb-4">
                        <button 
                          onClick={() => {
                            addLog(`📞 Cuidador atendió la llamada de emergencia de ${incomingCallFrom}`);
                            SpeakText(`Llamada enlazada. Estás conectada con ${incomingCallFrom}.`);
                            setIncomingCallFrom(null);
                          }}
                          className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl text-xs transition-all shadow-md active:scale-95 flex items-center justify-center gap-2"
                        >
                          <i data-lucide="phone" className="w-4 h-4"></i>
                          <span>CONTESTAR LLAMADA</span>
                        </button>
                        <button 
                          onClick={() => {
                            addLog(`🚫 Cuidador rechazó o finalizó la alerta de llamada de ${incomingCallFrom}`);
                            setIncomingCallFrom(null);
                          }}
                          className="w-full bg-white/10 hover:bg-white/20 text-white font-bold py-2 rounded-lg text-[10px] uppercase tracking-wider"
                        >
                          Rechazar Alerta
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>

          </div>

        </div>
      );
    }

    // Renderizar la aplicación en el DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
